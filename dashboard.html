<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Car Regulation Timeline (2025–2029)</title>
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f8fafc;
    margin: 30px;
    color: #333;
  }
  h1 { text-align: center; margin-bottom: 15px; color: #2c3e50; }
  h2 { color: #34495e; margin-top: 30px; }
  .controls { text-align: center; margin-bottom: 20px; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    font-size: 14px;
    table-layout: auto;
    overflow-x: auto;
    display: block;
    white-space: nowrap;
    
  }
  th, td {
  border: 1px solid #ccc;
  text-align: center;
  padding: 8px;
  width: 8.33%; /* For 12 months (100 / 12 ≈ 8.33%) */
  word-wrap: break-word;
}


  th {
    background-color: #34495e;
    color: white;
    position: relative;
  }
  th .resize-handle {
  position: absolute;
  right: 0;
  top: 0;
  width: 5px;
  height: 100%;
  cursor: col-resize;
  user-select: none;
}

  tr:nth-child(even) { background-color: #f2f2f2; }

  .planned { background-color: #36b9cc; color: white; font-weight: bold; }
  .implemented { background-color: #1cc88a; color: white; font-weight: bold; }
  .highlight { background-color: #1cc88a; color: white; font-weight: bold; border-radius: 4px; padding: 2px 6px; }

  .legend { margin-top: 10px; text-align: center; }
  .legend span {
    display: inline-block;
    margin-right: 20px;
    padding: 5px 10px;
    border-radius: 4px;
    color: white;
    font-weight: bold;
  }

  .toggle-buttons {
    text-align: center;
    margin-bottom: 15px;
  }

  .toggle-buttons button {
    background-color: #34495e;
    color: white;
    border: none;
    padding: 8px 16px;
    margin: 0 8px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }

  .toggle-buttons button.active {
    background-color: #1cc88a;
  }

  .hidden {
  display: none;
}

.dragging {
  opacity: 0.5;
  border: 2px dashed #3498db;
}

.drop-target {
  background-color: #e8f6ff;
  border: 2px dashed #3498db;
}
div[draggable='true'].editing {
  border: 1px dashed #555;
  background-color: #fff3cd;
  color: #333;
}


</style>
</head>
<body>

<h1>Car Regulation Roadmap (2025–2029)</h1>
<a href="input.html" class="btn-view">➡ Go to Input page</a>

<div class="toggle-buttons">
  <button id="showReg" class="active">Regulation-wise View</button>
  <button id="showModel">Model-wise View</button>
</div>



<div class="controls">
  <label><input type="checkbox" name="viewMode" class="viewMode" value="year" checked> Year</label>
  <label><input type="checkbox" name="viewMode" class="viewMode" value="month" checked> Month</label>
  <label><input type="checkbox" name="viewMode" class="viewMode" value="quarter"> Quarter</label>
</div>

<div id="dataManager" style="text-align:center; margin-bottom:20px;">
  <div id="regList"></div>
  <div id="modelList" style="margin-top:10px;"></div>
</div>
<h2 id="regHeader">Regulation-wise Timeline</h2>
<table id="regTable"></table>


<h2 id="modelHeader" class="hidden">Model-wise Timeline</h2>
<table id="modelTable" class="hidden"></table>


<script>
const data = {
  planned: { "BS7": "Apr 12 2027", "RDE": "Oct 5 2026", "OBD3": "Mar 22 2028" },
  regulations: ["BS7", "RDE", "OBD3"],
  models: ["YTA", "YTB", "YTC"],
  timeline: {
    BS7: { YTA: "Apr 9 2027", YTB: "Jun 18 2027", YTC: "Dec 25 2027" },
    RDE: { YTA: "Aug 14 2026", YTB: "Oct 20 2026", YTC: "Dec 28 2026" },
    OBD3: { YTA: "May 6 2028", YTB: "Jul 15 2028", YTC: "Sep 23 2028" },
  }
};




// ---------------- Enable Drag & Drop ----------------
let draggedCell = null;
function enableDragAndDrop() {
  let copyMode = false;

  // track ctrl/cmd in real-time
  window.addEventListener("keydown", e => {
    if (e.key === "Control" || e.metaKey) copyMode = true;
  });
  window.addEventListener("keyup", e => {
    if (e.key === "Control" || !e.metaKey) copyMode = false;
  });

  const tables = document.querySelectorAll("table");

  tables.forEach(table => {
    table.addEventListener("dragstart", e => {
      if (!e.target.matches("div[draggable='true']")) return;
      window.draggedElement = e.target;
      e.dataTransfer.effectAllowed = "copyMove";
      e.target.classList.add("dragging");
      copyMode = e.ctrlKey || e.metaKey;
    });

    table.addEventListener("dragend", e => {
      if (e.target.matches("div[draggable='true']")) {
        e.target.classList.remove("dragging");
        window.draggedElement = null;
      }
    });

    table.addEventListener("dragover", e => {
      if (!e.target.closest("td")) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = copyMode ? "copy" : "move";
      e.target.closest("td").classList.add("drop-target");
    });

    table.addEventListener("dragleave", e => {
      const td = e.target.closest("td");
      if (td) td.classList.remove("drop-target");
    });

    table.addEventListener("drop", e => {
      e.preventDefault();
      const td = e.target.closest("td");
      if (!td || !window.draggedElement) return;
      td.classList.remove("drop-target");

      const dragged = window.draggedElement;
      if (copyMode) {
        const clone = dragged.cloneNode(true);
        clone.classList.remove("dragging");
        clone.setAttribute("draggable", "true");
        td.appendChild(clone);
      } else {
        td.appendChild(dragged);
      }
    });
  });
}



function enableEditing() {
  document.querySelectorAll("div[draggable='true']").forEach(el => {
    el.addEventListener("dblclick", e => {
      e.stopPropagation();
      el.setAttribute("contenteditable", "true");
      el.focus();
      el.classList.add("editing");

      // disable dragging while editing
      el.setAttribute("draggable", "false");
    });

    el.addEventListener("blur", () => {
      el.removeAttribute("contenteditable");
      el.classList.remove("editing");

      // re-enable dragging after editing
      el.setAttribute("draggable", "true");
    });

    // Allow pressing Enter to finish editing quickly
    el.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        el.blur();
      }
    });
  });
}


function buildDataManager() {
  const regContainer = document.getElementById('regList');
  const modelContainer = document.getElementById('modelList');
  regContainer.innerHTML = "<strong>Regulations:</strong> ";
  modelContainer.innerHTML = "<strong>Models:</strong> ";

  data.regulations.forEach(reg => {
    const checked = Object.keys(data.timeline).includes(reg);
    regContainer.innerHTML += `
      <label style="margin-right:10px;">
        <input type="checkbox" class="regCheck" value="${reg}" ${checked ? 'checked' : ''}> ${reg}
      </label>`;
  });

  data.models.forEach(model => {
    const used = Object.values(data.timeline).some(r => r.hasOwnProperty(model));
    modelContainer.innerHTML += `
      <label style="margin-right:10px;">
        <input type="checkbox" class="modelCheck" value="${model}" ${used ? 'checked' : ''}> ${model}
      </label>`;
  });

  // When regulation checkbox toggles
  document.querySelectorAll('.regCheck').forEach(cb => {
    cb.addEventListener('change', e => {
      const reg = e.target.value;
      if (e.target.checked) {
        // Add new regulation to data if missing
        if (!data.timeline[reg]) {
          data.timeline[reg] = {};
          data.planned[reg] = "Jan 1 2027"; // default planned date
        }
      } else {
        // Remove regulation if unchecked
        delete data.timeline[reg];
        delete data.planned[reg];
      }
      rebuildAndRefresh();
    });
  });

  // When model checkbox toggles
  document.querySelectorAll('.modelCheck').forEach(cb => {
    cb.addEventListener('change', e => {
      const model = e.target.value;
      if (e.target.checked) {
        // Add model across all existing regulations if missing
        for (let reg in data.timeline) {
          if (!data.timeline[reg][model]) {
            data.timeline[reg][model] = "Jan 1 2027"; // default date
          }
        }
      } else {
        // Remove model from all regulations
        for (let reg in data.timeline) {
          delete data.timeline[reg][model];
        }
      }
      rebuildAndRefresh();
    });
  });
}

function makeColumnsResizable(tableId) {
  const table = document.getElementById(tableId);
  const cols = table.querySelectorAll("th");

  cols.forEach(th => {
    const handle = document.createElement("div");
    handle.classList.add("resize-handle");
    th.appendChild(handle);

    let startX, startWidth;

    handle.addEventListener("mousedown", (e) => {
      startX = e.pageX;
      startWidth = th.offsetWidth;
      document.documentElement.style.cursor = "col-resize";
      document.addEventListener("mousemove", onMouseMove);
      document.addEventListener("mouseup", onMouseUp);
    });

    function onMouseMove(e) {
      const diffX = e.pageX - startX;
      const newWidth = Math.max(40, startWidth + diffX);
      th.style.width = newWidth + "px";
    }

    function onMouseUp() {
      document.documentElement.style.cursor = "";
      document.removeEventListener("mousemove", onMouseMove);
      document.removeEventListener("mouseup", onMouseUp);
    }
  });
}

function rebuildAndRefresh() {
  const mode = document.querySelector('input[name="viewMode"]:checked').value;
  buildTables(mode);
  enableDragAndDrop();
  enableEditing();
  buildDataManager();
  makeColumnsResizable("regTable");
  makeColumnsResizable("modelTable");

}



// ---------------- Helper ----------------
function matchesPeriod(month, day, period, mode) {
  const monthMap = {
    Jan: '01', Feb: '02', Mar: '03', Apr: '04', May: '05', Jun: '06',
    Jul: '07', Aug: '08', Sep: '09', Oct: '10', Nov: '11', Dec: '12'
  };
  const mNum = monthMap[month];
  const months = ['01','02','03','04','05','06','07','08','09','10','11','12'];
  const mIndex = months.indexOf(mNum);

  if (mode === 'month') return period === mNum;
  if (mode === 'quarter') return (
    (period === 'Q1' && mIndex < 3) ||
    (period === 'Q2' && mIndex >= 3 && mIndex < 6) ||
    (period === 'Q3' && mIndex >= 6 && mIndex < 9) ||
    (period === 'Q4' && mIndex >= 9)
  );
  if (mode === 'phase') return (
    (period.includes('B') && day >= 1 && day <= 10) ||
    (period.includes('M') && day >= 11 && day <= 20) ||
    (period.includes('E') && day >= 21)
  );
  return false;
}

// ---------------- Event Listeners ----------------
document.querySelectorAll('input[name="viewMode"]').forEach(r =>
  r.addEventListener('change', () => {
    const mode = document.querySelector('input[name="viewMode"]:checked').value;
    buildTables(mode);
    enableDragAndDrop(); // reattach handlers
    enableEditing();
    buildDataManager();
    makeColumnsResizable("regTable");
    makeColumnsResizable("modelTable");
  })
);


document.getElementById('showReg').addEventListener('click', () => {
  document.getElementById('regTable').classList.remove('hidden');
  document.getElementById('regHeader').classList.remove('hidden');
  document.getElementById('modelTable').classList.add('hidden');
  document.getElementById('modelHeader').classList.add('hidden');
  document.getElementById('showReg').classList.add('active');
  document.getElementById('showModel').classList.remove('active');
});

document.getElementById('showModel').addEventListener('click', () => {
  document.getElementById('modelTable').classList.remove('hidden');
  document.getElementById('modelHeader').classList.remove('hidden');
  document.getElementById('regTable').classList.add('hidden');
  document.getElementById('regHeader').classList.add('hidden');
  document.getElementById('showModel').classList.add('active');
  document.getElementById('showReg').classList.remove('active');
});

document.querySelectorAll('.viewMode').forEach(cb => {
  cb.addEventListener('change', rebuildDynamicTable);
});


function rebuildDynamicTable() {
  const selected = Array.from(document.querySelectorAll('.viewMode:checked')).map(c => c.value);
  if (selected.length === 0) {
    document.getElementById('regTable').innerHTML =
      "<tr><td colspan='100%' style='text-align:center;color:#888;'>Select at least one header type</td></tr>";
    document.getElementById('modelTable').innerHTML = "";
    return;
  }
  buildFlexibleTable(selected);
}

function buildFlexibleTable(selected) {
  const regTable = document.getElementById('regTable');
  const modelTable = document.getElementById('modelTable');
  regTable.innerHTML = '';
  modelTable.innerHTML = '';

  const years = [2025, 2026, 2027, 2028, 2029];
  const months = ['01','02','03','04','05','06','07','08','09','10','11','12'];
  const quarters = ['Q1','Q2','Q3','Q4'];

  // ---------------- Header Builder ----------------
  function createHeader(firstCol) {
  let html = "";
  const years = [2025, 2026, 2027, 2028, 2029];
  const months = ['01','02','03','04','05','06','07','08','09','10','11','12'];
  const quarters = ['Q1','Q2','Q3','Q4'];

  const totalRows = 1 + (selected.includes('quarter') ? 1 : 0) + (selected.includes('month') ? 1 : 0);

  // === Row 1: Year ===
  html += `<tr><th rowspan="${totalRows}">${firstCol}</th>`;
  for (let y of years) {
    let colspan = 1;
    if (selected.includes('quarter')) colspan = 12;
    else if (selected.includes('month')) colspan = 12;
    html += `<th colspan="${colspan}">${y}</th>`;
  }
  html += `</tr>`;

  // === Row 2: Quarter ===
  if (selected.includes('quarter')) {
    html += `<tr>`;
    for (let y of years) {
      quarters.forEach(q => html += `<th colspan="3">${q}</th>`);
    }
    html += `</tr>`;
  }

  // === Row 3: Month ===
  if (selected.includes('month')) {
    html += `<tr>`;
    for (let y of years) {
      months.forEach(m => html += `<th>${m}</th>`);
    }
    html += `</tr>`;
  }

  return html;
}


  // ---------------- Regulation-wise Table ----------------
  let regHTML = createHeader('Regulation');
  regHTML += buildRows('regulation', years, months, quarters, selected);
  regTable.innerHTML = regHTML;

  // ---------------- Model-wise Table ----------------
  let modelHTML = createHeader('Model');
  modelHTML += buildRows('model', years, months, quarters, selected);
  modelTable.innerHTML = modelHTML;

  enableDragAndDrop();
  enableEditing();
  makeColumnsResizable("regTable");
  makeColumnsResizable("modelTable");
}

function buildRows(type, years, months, quarters, selected) {
  let html = '';

  // ===== Planned row =====
  html += `<tr><td class="planned">Planned</td>`;
  for (let y of years) {
    if (selected.includes('quarter')) {
      quarters.forEach(q => {
        for (let i = 0; i < 3; i++) {
          html += `<td></td>`;
        }
      });
    } else if (selected.includes('month')) {
      months.forEach(m => {
        let mark = '';
        for (let reg of data.regulations) {
          const [month, day, year] = data.planned[reg].split(' ');
          if (parseInt(year) === y && matchesPeriod(month, parseInt(day), m, 'month'))
            mark += `<div draggable="true">${reg}</div>`;
        }
        html += `<td class="planned">${mark}</td>`;
      });
    } else {
      // Year-only
      let mark = '';
      for (let reg of data.regulations) {
        const [month, day, year] = data.planned[reg].split(' ');
        if (parseInt(year) === y) mark += `<div draggable="true">${reg}</div>`;
      }
      html += `<td class="planned">${mark}</td>`;
    }
  }
  html += '</tr>';

  // ===== Regulation or Model rows =====
  const outerList = type === 'regulation' ? data.regulations : data.models;

  outerList.forEach(item => {
    html += `<tr><td>${item}</td>`;
    for (let y of years) {
      // ---- Quarter view ----
      if (selected.includes('quarter')) {
        quarters.forEach(q => {
          for (let i = 0; i < 3; i++) { // each quarter has 3 months
            let mark = '';
            if (type === 'regulation') {
              for (let model of data.models) {
                const [month, day, year] = data.timeline[item][model].split(' ');
                if (parseInt(year) === y && matchesPeriod(month, parseInt(day), q, 'quarter'))
                  mark += `<div class="highlight" draggable="true">${model}</div>`;
              }
            } else {
              for (let reg of data.regulations) {
                const [month, day, year] = data.timeline[reg][item].split(' ');
                if (parseInt(year) === y && matchesPeriod(month, parseInt(day), q, 'quarter'))
                  mark += `<div class="highlight" draggable="true">${reg}</div>`;
              }
            }
            html += `<td>${mark}</td>`;
          }
        });
      }

      // ---- Month view ----
      else if (selected.includes('month')) {
        months.forEach(m => {
          let mark = '';
          if (type === 'regulation') {
            for (let model of data.models) {
              const [month, day, year] = data.timeline[item][model].split(' ');
              if (parseInt(year) === y && matchesPeriod(month, parseInt(day), m, 'month'))
                mark += `<div class="highlight" draggable="true">${model}</div>`;
            }
          } else {
            for (let reg of data.regulations) {
              const [month, day, year] = data.timeline[reg][item].split(' ');
              if (parseInt(year) === y && matchesPeriod(month, parseInt(day), m, 'month'))
                mark += `<div class="highlight" draggable="true">${reg}</div>`;
            }
          }
          html += `<td>${mark}</td>`;
        });
      }

      // ---- Year-only view ----
      else {
        let mark = '';
        if (type === 'regulation') {
          for (let model of data.models) {
            const [month, day, year] = data.timeline[item][model].split(' ');
            if (parseInt(year) === y)
              mark += `<div class="highlight" draggable="true">${model}</div>`;
          }
        } else {
          for (let reg of data.regulations) {
            const [month, day, year] = data.timeline[reg][item].split(' ');
            if (parseInt(year) === y)
              mark += `<div class="highlight" draggable="true">${reg}</div>`;
          }
        }
        html += `<td>${mark}</td>`;
      }
    }
    html += `</tr>`;
  });

  return html;
}


// Initialize default (year + month)
buildFlexibleTable(['year', 'month']);
enableDragAndDrop();
enableEditing();
buildDataManager();

</script>

</body>
</html>
